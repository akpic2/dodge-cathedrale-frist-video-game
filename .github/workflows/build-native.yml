name: Build Windows native game (SDL3 x64 + ARM64) - packaging fix
on:
  push:
    branches: [native-cpp-sdl3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        triplet: [x64-windows, arm64-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
      - name: Install SDL3 dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet ${{ matrix.triplet }} --x-manifest-root=native
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        run: cmake --build native/build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item native/build/Release/DodgeCathedrale.exe dist/
          Copy-Item -Recurse native/build/Release/assets dist/assets
          Get-ChildItem "native/build/Release/*.dll" | Copy-Item -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath DodgeCathedrale-Windows-${{ matrix.triplet }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DodgeCathedrale-Windows-${{ matrix.triplet }}
          path: DodgeCathedrale-Windows-${{ matrix.triplet }}.zip
          if-no-files-found: error
