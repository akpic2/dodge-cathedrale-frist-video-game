name: Build Windows native game
on:
  push:
    branches: [native-cpp-sdl3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '**/vcpkg.json'
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build native/build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/assets | Out-Null
          Copy-Item -Recurse assets/img dist/assets/img
          Copy-Item native/build/Release/DodgeCathedrale.exe dist/
          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/SDL3.dll" dist/
          Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/SDL3_image.dll" dist/
          if (Test-Path "$env:VCPKG_ROOT/installed/x64-windows/bin/libpng16.dll") { Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/libpng16.dll" dist/ }
          if (Test-Path "$env:VCPKG_ROOT/installed/x64-windows/bin/zlib1.dll") { Copy-Item "$env:VCPKG_ROOT/installed/x64-windows/bin/zlib1.dll" dist/ }
          Compress-Archive -Path dist/* -DestinationPath DodgeCathedrale-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DodgeCathedrale-Windows-x64
          path: DodgeCathedrale-Windows-x64.zip
          if-no-files-found: error
